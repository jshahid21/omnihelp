# =============================================================================
# Omni-Help — Nginx reverse proxy configuration
# =============================================================================
# Proxies HTTP traffic on port 80 to the Streamlit container on port 8501.
# Certbot will automatically append the HTTPS (port 443) server block and
# manage certificate renewal when you run:
#
#   certbot --nginx -d saving.fit -d www.saving.fit
#
# Deploy this file with:
#   sudo bash scripts/deploy_ssl.sh
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name saving.fit www.saving.fit;

    # -------------------------------------------------------------------------
    # Streamlit proxy
    # Streamlit uses WebSockets for live UI updates — the Upgrade/Connection
    # headers are required or the browser will show a blank/frozen page.
    # -------------------------------------------------------------------------
    location / {
        proxy_pass         http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # WebSocket upgrade headers (critical for Streamlit)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Standard reverse proxy headers
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Prevent proxy timeouts on long LLM calls (up to 90s)
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
